name: Update Mergado feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mergado-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate current CSV
        run: python generate_feed.py
      - name: Commit only when feed changed
        run: |
          if git diff --quiet -- docs/mergado-import.csv; then
            echo "Feed is unchanged."
            exit 0
          fi
          git config user.name "louie-feed-bot"
          git config user.email "louie-feed-bot@users.noreply.github.com"
          git add docs/mergado-import.csv docs/status.json
          git commit -m "chore: refresh Mergado feed"
          git push
